[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14243A"
borderColor = "#DBE3EF"
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
font = "sans serif"
baseFontSize = 15
headingFontSizes = ["2rem", "1.3rem", "1.1rem", "1rem", "1rem", "1rem"]
paddingTop = "1.25rem"
paddingBottom = "1rem"
